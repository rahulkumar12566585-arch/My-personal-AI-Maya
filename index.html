<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya - Personal AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #28304a;
      background: #11182b;
    }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 6px 0 0; color: #aab3cc; }
    #chat {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
    }
    .msg {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .maya { background: #1d2944; margin-right: auto; }
    .user { background: #3156a6; margin-left: auto; }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #11182b;
      border-top: 1px solid #28304a;
    }
    input {
      flex: 1;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 18px;
      cursor: pointer;
    }
    #mic { background: #26324e; color: white; }
    #send { background: #4f7cff; color: white; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🤖 Maya</h1>
      <p>My Personal AI</p>
    </header>

    <main id="chat">
      <div class="msg maya">नमस्ते! मैं Maya हूँ। 👋
मुझसे कुछ भी पूछो।</div>
    </main>

    <div class="input-area">
      <button id="mic" title="बोलकर लिखें">🎤</button>
      <input id="input" type="text" placeholder="Maya से बात करें..." autocomplete="off">
      <button id="send">➤</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const mic = document.getElementById("mic");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function mayaReply(text) {
      const t = text.toLowerCase();

      if (t.includes("hello") || t.includes("hi") || t.includes("नमस्ते")) {
        return "नमस्ते! 😊 मैं Maya हूँ।";
      }
      if (t.includes("नाम") || t.includes("name")) {
        return "मेरा नाम Maya है — आपका Personal AI.";
      }
      if (t.includes("कैसे हो") || t.includes("how are you")) {
        return "मैं बढ़िया हूँ! 😊 आप कैसे हैं?";
      }
      return "मैंने आपका संदेश सुना: " + text +
             "\n\nअभी Maya का basic version चल रहा है। अगली फाइल में हम असली AI जवाब जोड़ेंगे।";
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(mayaReply(text), "maya");
      }, 400);
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    // मोबाइल में बोलकर टेक्स्ट लिखने की सुविधा
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.continuous = false;

      mic.addEventListener("click", () => {
        recognition.start();
        mic.textContent = "🎙️";
      });

      recognition.onresult = event => {
        input.value = event.results[0][0].transcript;
        mic.textContent = "🎤";
      };

      recognition.onend = () => {
        mic.textContent = "🎤";
      };
    } else {
      mic.addEventListener("click", () => {
        alert("आपके ब्राउज़र में voice input उपलब्ध नहीं है।");
      });
    }
  </script>
</body>
</html>
